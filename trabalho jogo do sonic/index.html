<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sonic Infinite Escape</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- MENU -->

    <div id="menu">

        <div class="menuCard">

            <h1>SONIC INFINITE ESCAPE</h1>

            <div class="menuContent">

                <h2>COMANDOS</h2>

                <p>⬅️ ➡️ = MOVIMENTAR</p>

                <p>⬆️ = PULAR</p>

                <p>SPACE = ATIRAR</p>

                <p>SHIFT = EXPLOSÃO</p>

                <h3>OBJETIVO</h3>

                <p>
                    Suba infinitamente,
                    sobreviva,
                    destrua asteroides
                    e avance pelas fases.
                </p>

                <button id="startBtn">

                    INICIAR JOGO

                </button>

            </div>

        </div>

    </div>

    <!-- GAME -->

    <div id="game">

        <div id="background"></div>

        <!-- HUD -->

        <div id="hud">

            <div class="hudBox">

                <span>PONTOS</span>

                <strong id="score">

                    0

                </strong>

            </div>

            <div class="hudBox">

                <span>FASE</span>

                <strong id="level">

                    1

                </strong>

            </div>

            <div class="hudBox">

                <span>VIDAS</span>

                <strong id="lives">

                    3

                </strong>

            </div>

            <div class="hudBox">

                <span>EXPLOSÃO</span>

                <strong id="powerText">

                    PRONTO

                </strong>

                <div id="powerBar">

                    <div id="powerFill"></div>

                </div>

            </div>

        </div>

        <!-- PLAYER -->

        <div id="player"></div>

        <!-- GAME OVER -->

        <div id="gameOver">

            <div class="gameOverBox">

                <h1>GAME OVER</h1>

                <p id="finalScore"></p>

                <button onclick="restartGame()">

                    REINICIAR

                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
